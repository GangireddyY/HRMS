name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    # Conventional Commits (commitlint.config.cjs) for every commit a pull request adds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Check commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms_ci
          POSTGRES_DB: hrms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      # Runs the shared rate-limit counter test against a real Redis.
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Audit production dependencies
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Lint
        run: |
          npm --prefix backend run lint
          npm --prefix frontend run lint

      - name: Create test environment (ephemeral secrets)
        run: |
          cat > backend/.env.test <<EOF
          NODE_ENV=test
          PORT=3001
          CORS_ORIGINS=http://localhost:5174
          APP_URL=http://localhost:5174
          TRUST_PROXY=0
          DB_NAME=hrms_test
          DB_USER=hrms
          DB_PASSWORD=hrms_ci
          DB_HOST=localhost
          DB_PORT=5432
          JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          JWT_ACCESS_TTL_SECONDS=900
          REFRESH_TOKEN_TTL_DAYS=7
          DATA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          COOKIE_SECURE=false
          MFA_ISSUER=HRMS-CI
          ALLOW_ORGANIZATION_SIGNUP=true
          DEFAULT_PLAN_CODE=starter
          SENDGRID_FROM_EMAIL=no-reply@hrms.local
          SENDGRID_FROM_NAME=HRMS
          SUPERADMIN_EMAIL=superadmin@e2e.test
          SUPERADMIN_PASSWORD=Sa!$(openssl rand -hex 8)9Aa
          E2E_ORG_ADMIN_EMAIL=admin@acme.test
          E2E_ORG_ADMIN_PASSWORD=Oa!$(openssl rand -hex 8)7Bb
          EOF

      - name: Typecheck
        run: |
          npm --prefix backend run typecheck
          npm --prefix frontend run typecheck

      - name: Migrations (up, roll back all, up)
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          npm run db:migrate
          max=$(( $(ls src/database/migrations/*.up.sql | wc -l) + 1 ))
          for i in $(seq 1 "$max"); do
            out=$(npm run --silent db:migrate:down)
            echo "$out"
            if grep -q 'Nothing to revert' <<<"$out"; then break; fi
            if [ "$i" -eq "$max" ]; then echo "::error::Migrations were not fully rolled back after $max down steps"; exit 1; fi
          done
          status=$(npm run --silent db:migrate:status)
          echo "$status"
          grep -q '^Executed (0):' <<<"$status" || { echo "::error::Migrations still applied after full rollback"; exit 1; }
          npm run db:migrate

      - name: Backend unit tests (with coverage gate)
        run: npm --prefix backend run test:cov -- --coverageReporters=text-summary

      - name: Backend integration tests (PostgreSQL)
        run: npm --prefix backend run test:e2e

      - name: Backup and verified restore
        # Same client version as the server (postgres:17), on the runner's network.
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=hrms_test -e DB_USER=hrms -e PGPASSWORD=hrms_ci \
            -e MIGRATIONS_DIR=backend/src/database/migrations \
            postgres:17-alpine sh -c 'dump=$(sh scripts/db-backup.sh /tmp/backups) && sh scripts/db-restore-verify.sh "$dump"'

      - name: Frontend unit tests (with coverage gate)
        run: npm --prefix frontend run test:cov

      - name: Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  android:
    # The store app: the Capacitor Android project compiles (unsigned debug APK).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --prefix frontend
      - name: Sync the native project
        working-directory: frontend
        env:
          HRMS_APP_URL: https://hrms.example.com
        run: npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PHRMS_HOST=hrms.example.com
      - uses: actions/upload-artifact@v4
        with:
          name: hrms-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    # The store app: the Capacitor iOS project compiles for the simulator (no signing). macOS minutes: main only.
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Sync the native project
        working-directory: frontend
        env:
          HRMS_APP_URL: https://hrms.example.com
        run: npx cap sync ios
      - name: Build for the simulator
        working-directory: frontend/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO HRMS_HOST=hrms.example.com

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hrms-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t hrms-frontend:${{ github.sha }} .
