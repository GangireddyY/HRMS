# Full local stack: PostgreSQL, Redis, MinIO (S3-compatible storage), backend and frontend. Email goes through SendGrid.
#   cp .env.docker.example .env.docker                  # infrastructure secrets
#   cp backend/.env.docker.example backend/.env.docker  # backend app secrets
#   docker compose --env-file .env.docker up -d --build
name: hrms

x-backend-env: &backend-env
  # Connection settings derived from the infrastructure secrets (override backend/.env.docker).
  # The API connects as hrms_app (row access only); migrations run as the schema owner and keep hrms_app's grants current.
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: hrms
  DB_USER: hrms_app
  DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
  # Postgres is only reachable on the compose network; use DB_SSL=true for any database outside it.
  DB_ALLOW_INSECURE: 'true'
  UPLOAD_SCAN: clamav
  CLAMAV_HOST: clamav
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379

x-backend: &backend
  build: { context: ./backend }
  env_file: ./backend/.env.docker
  environment: *backend-env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hrms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ['127.0.0.1:5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms -d hrms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      retries: 10

  # Uploads are scanned before they're stored (clamd INSTREAM); signatures update themselves (freshclam).
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']

  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      DB_MIGRATION_USER: hrms
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ['sh', '-c', 'node dist/database/migrate.js up && node dist/database/reencrypt.js && node dist/cli/bootstrap.js']
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ['127.0.0.1:8080:8080']
    depends_on: [backend]

volumes:
  clamavdb:
  pgdata:
  redisdata:
  miniodata:
