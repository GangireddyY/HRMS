# Included in every location that sets its own add_header: nginx drops server-level add_header directives in any
# location that declares one, so these must be repeated there.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Browsers ignore HSTS over plain http, so this only takes effect behind the TLS terminator.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Inline styles stay allowed (Vue style bindings); scripts must be same-origin files.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
